<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Roots & Wings</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script>window.ENV_API_URL = "https://roots-wings-api.onrender.com";</script>
</head>
<body>
<div class="s-auth">
  <div class="auth-wrap">
    <div class="logo-row">
      <div class="lm"><i class="ti ti-leaf"></i></div>
      <span class="logo-text">Roots & Wings</span>
    </div>
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to the alumni connection portal</p>

      <div class="role-tabs">
        <button class="rtab active" data-role="alumni"><i class="ti ti-user-check"></i>Alumni</button>
        <button class="rtab" data-role="resident"><i class="ti ti-school"></i>Resident</button>
        <button class="rtab" data-role="admin"><i class="ti ti-shield"></i>Admin</button>
      </div>

      <div class="demo-pills">
        <span style="font-size:11px;color:var(--muted)">Demo:</span>
        <span class="demo-pill" data-demo="priya@demo.com|Demo@123|alumni">Alumni</span>
        <span class="demo-pill" data-demo="resident@demo.com|Demo@123|resident">Resident</span>
        <span class="demo-pill" data-demo="admin@rootswings.org|Admin@1234|admin">Admin</span>
      </div>

      <div id="login-error" class="err-box"></div>

      <form id="login-form">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
            <button type="button" class="pw-eye"><i class="ti ti-eye"></i></button>
          </div>
        </div>
        <div style="text-align:right;margin-bottom:12px">
          <a href="/forgot.html" style="font-size:12px;color:var(--forest)">Forgot password?</a>
        </div>
        <button type="submit" id="login-btn" class="btn-main">Sign in</button>
      </form>

      <div class="divider">or</div>
      <div class="sw">New alumni? <a href="/signup.html">Create an account</a></div>
    </div>
  </div>
</div>

<div class="toast-wrap"><div id="toast-el" class="toast"></div></div>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
