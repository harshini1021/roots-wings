<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Roots & Wings</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script>window.ENV_API_URL = "http://localhost:5000";</script>
</head>
<body>
<div class="s-auth">
  <div class="auth-wrap">
    <div class="logo-row">
      <div class="lm"><i class="ti ti-leaf"></i></div>
      <span class="logo-text">Roots & Wings</span>
    </div>
    <div class="auth-card">
      <button class="back-link" onclick="window.location.href='/login.html'">
        <i class="ti ti-arrow-left" style="font-size:15px"></i> Back to sign in
      </button>
      <h2>Reset password</h2>
      <p class="sub">Enter your email and we'll send a reset link</p>
      <div id="forgot-ok" class="ok-box"></div>
      <div id="forgot-error" class="err-box"></div>
      <form id="forgot-form">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn-main">Send reset link</button>
      </form>
    </div>
  </div>
</div>
<div class="toast-wrap"><div id="toast-el" class="toast"></div></div>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
