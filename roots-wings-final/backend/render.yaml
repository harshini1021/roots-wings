services:
  - type: web
    name: roots-wings-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/seed.js && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
